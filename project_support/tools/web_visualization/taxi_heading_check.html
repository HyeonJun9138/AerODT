<!doctype html><html lang="ko"><meta charset="utf-8"><title>지상 코너 방향 동기화 검증</title>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Widgets/widgets.css">
<style>html,body,#view{width:100%;height:100%;margin:0}nav{position:absolute;top:12px;left:12px;padding:14px;background:#d5e0e5e8;border-radius:15px;font:13px sans-serif}button{padding:8px}input{width:300px}</style>
<div id="view"></div><nav><b>실제 경로 · 코너 회전</b><br><button id="before">코너 전</button><button id="corner">코너 중</button><button id="after">코너 후</button><button id="play">재생 / 정지</button><br><input id="time" type="range" step=".02"><pre id="report"></pre></nav>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Cesium.js"></script>
<script type="module">
import {FlightLayer} from '/visualization/flight_layer.js';
import {VertiportLayer} from '/visualization/vertiport_layer.js';
import {resolvePlan,readRun,sampleRun,groundMotionAt,groundHeadingAt} from '/flight-plan.js';
const C=Cesium,v=new C.Viewer('view',{baseLayer:false,globe:false,skyBox:false,skyAtmosphere:false,animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,selectionIndicator:false,infoBox:false});
v.scene.backgroundColor=C.Color.fromCssColorString('#8cabbc');
const run=await fetch('/taxi-heading.json').then(r=>r.json()),record=run.arrival_record;
const ports=new VertiportLayer(C,v);await ports.place(record.id,record);
const plan=await resolvePlan(run.plan,{deckTop:()=>record.platform_height_m+.06});
const samples=readRun(plan,run.states),layer=new FlightLayer(C,v,{assets:id=>run.assets.find(a=>a.asset_id===id)});layer.show(plan);
const leg=plan.legs.find(l=>l.stage==='gate_in'),p=leg.ground_motion;
const i=p.headings_deg.findIndex(h=>Math.abs((h-p.headings_deg[0]+540)%360-180)>40),corner=leg.start_s+p.times_s[i];
const slider=document.getElementById('time');slider.min=leg.start_s;slider.max=leg.end_s;slider.value=corner;
let playing=false,last=performance.now();
for(const [id,delta] of [['before',-4],['corner',0],['after',4]])document.getElementById(id).onclick=()=>{playing=false;slider.value=corner+delta;};
document.getElementById('play').onclick=()=>playing=!playing;
v.scene.preRender.addEventListener(()=>{
 const now=performance.now();if(playing)slider.value=Math.min(+slider.max,+slider.value+(now-last)/1000);last=now;
 const s=sampleRun(samples,+slider.value);layer.moveTo(s);const at=s.position;
 const frame=C.Transforms.eastNorthUpToFixedFrame(C.Cartesian3.fromDegrees(at.longitude,at.latitude,at.altitude_m));v.camera.lookAtTransform(frame,new C.Cartesian3(18,-26,18));
 const g=groundMotionAt(p,s.time_s-leg.start_s),target=groundHeadingAt(p,g.fraction,s.time_s-leg.start_s);
 document.getElementById('report').textContent=JSON.stringify({time:s.time_s,speed:s.speed_mps,heading:s.heading_deg,pathHeading:target,error:Math.abs((target-s.heading_deg+540)%360-180)},null,2);
});
</script></html>
