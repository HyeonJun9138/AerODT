<!doctype html><meta charset="utf-8"><title>UAM 이름표 크기 검증</title><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Widgets/widgets.css"><style>body{margin:0}#view{height:95vh}aside{position:absolute;top:8px;background:white;padding:10px}</style><div id="view"></div><aside><button data-height="100">100 m</button><button data-height="10000">10 km</button><button data-height="120000">120 km</button><pre id="result"></pre></aside>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Cesium.js"></script><script type="module">
import {FlightLayer} from '/visualization/flight_layer.js';const C=Cesium,v=new C.Viewer('view',{baseLayer:false,baseLayerPicker:false,geocoder:false,timeline:false,animation:false});v.scene.globe.baseColor=C.Color.fromCssColorString('#3b5364');
const layer=new FlightLayer(C,v);layer.show({vehicle:{id:'UAM-VP001-VP005'},legs:[]});layer.moveTo({position:{longitude:127,latitude:37.55,altitude_m:10},stage_label:'탑승 0/3명',time_s:0});
function view(height){v.camera.setView({destination:C.Cartesian3.fromDegrees(127,37.55,height)});layer.updateLabelLayout();const label=layer.vehicle.marker.label,t=v.clock.currentTime;document.getElementById('result').textContent=JSON.stringify({height,scale:label.scale.getValue(t),font:label.font.getValue(t),show:label.show.getValue(t),far:label.distanceDisplayCondition.getValue(t).far});}
for(const b of document.querySelectorAll('button[data-height]'))b.onclick=()=>view(+b.dataset.height);view(120000);window.addEventListener('pagehide',()=>{layer.destroy();v.destroy();},{once:true});
</script>
