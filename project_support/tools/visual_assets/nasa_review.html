<!doctype html><html lang="ko"><meta charset="utf-8"><title>NASA 모델 검증</title>
<style>body{margin:0;background:#182330;color:#dae7f1;font:15px sans-serif}header{padding:12px;display:flex;gap:12px;align-items:center}button,select{padding:7px;background:#2d4661;color:white;border:1px solid #62768b;border-radius:5px}#status{padding:8px}canvas{display:block}</style>
<header><select id="model" aria-label="모델"></select><button id="hover">호버</button><button id="cruise">순항</button><button id="stop">회전 정지</button><button id="front">정면</button><button id="side">측면</button><button id="exterior">입체</button><button id="save">사진 저장</button></header><div id="status">준비 중</div>
<script type="importmap">{"imports":{"three":"/project_support/environment/visual_assets/node_modules/three/build/three.module.js","three/addons/":"/project_support/environment/visual_assets/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const ids=['nasa_lift_cruise','nasa_multi_tiltrotor','nasa_qsmr','nasa_quadrotor_collflap','nasa_quadrotor_rpm','nasa_side_by_side','nasa_tiltduct_cross','nasa_tiltduct_direct','nasa_tiltwing'];
const select=document.querySelector('#model'),status=document.querySelector('#status');for(const id of ids)select.add(new Option(id,id));
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1100,620);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#dce4eb');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
scene.add(new T.HemisphereLight(0xffffff,0x495667,2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(15,30,10);scene.add(sun);
const camera=new T.PerspectiveCamera(42,1100/620,.01,1000);const controls=new OrbitControls(camera,renderer.domElement);const grid=new T.GridHelper(60,60,0x94a5b4,0xbfcbd4);scene.add(grid);
const arrow=new T.ArrowHelper(new T.Vector3(1,0,0),new T.Vector3(0,.05,0),5,0xdc3737);scene.add(arrow);
let model,meta,size,mid,spins=[],tilts=[],running=true,tilt=0,last=performance.now(),angle=0;
const base='/digital_twin/model_library/visual_assets/aircraft/civilian/';
function view(kind='exterior'){const l=size.length();camera.position.copy(mid).add(kind==='front'?new T.Vector3(l,0,0):kind==='side'?new T.Vector3(0,l*.08,l):new T.Vector3(l*.72,l*.43,l*.72));controls.target.copy(mid);controls.update();}
function pose(){for(const p of tilts)p.node.quaternion.setFromAxisAngle(new T.Vector3(1,0,0),(p.spec.offset_deg+p.spec.sign*tilt)*Math.PI/180).multiply(p.rest);for(const p of spins)p.node.quaternion.copy(p.rest).multiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(0,1,0),angle*p.spec.turn));model.updateMatrixWorld(true);}
async function load(){status.textContent='불러오는 중';if(model){scene.remove(model);model.traverse(o=>{o.geometry?.dispose();});}meta=await(await fetch(base+select.value+'/asset.json',{cache:'no-store'})).json();const gltf=await new GLTFLoader().loadAsync(base+select.value+'/model.glb?v='+meta.model.sha256);model=gltf.scene;scene.add(model);model.updateMatrixWorld(true);spins=meta.rotors.nodes.map(spec=>{const node=model.getObjectByName(spec.name);if(!node)throw Error(spec.name);return {node,spec,rest:node.quaternion.clone()};});tilts=(meta.rotors.tilt?.nodes??[]).map(spec=>{const node=model.getObjectByName(spec.name);if(!node)throw Error(spec.name);return{node,spec,rest:node.quaternion.clone()};});angle=0;pose();const box=new T.Box3().setFromObject(model);size=box.getSize(new T.Vector3());mid=box.getCenter(new T.Vector3());grid.position.y=box.min.y-.03;view();status.textContent=`${meta.title} | 길이 ${size.x.toFixed(2)} m / 높이 ${size.y.toFixed(2)} m / 폭 ${size.z.toFixed(2)} m | 회전 ${spins.length} / 틸트 ${tilts.length} | 빨간 화살표 +X 전방, 격자 1 m`;}
select.onchange=()=>load().catch(e=>status.textContent=e.stack);document.querySelector('#hover').onclick=()=>{tilt=0;pose();};document.querySelector('#cruise').onclick=()=>{tilt=90;pose();};document.querySelector('#stop').onclick=()=>{running=!running;document.querySelector('#stop').textContent=running?'회전 정지':'회전 시작';};for(const k of ['front','side','exterior'])document.querySelector('#'+k).onclick=()=>view(k);
document.querySelector('#save').onclick=async()=>{renderer.render(scene,camera);const jpg=renderer.domElement.toDataURL('image/jpeg',.86);const r=await fetch('/save/'+select.value,{method:'POST',headers:{'Content-Type':'text/plain'},body:jpg});status.textContent+=(r.ok?' | 사진 저장 완료':' | 저장 실패');};
function frame(now){requestAnimationFrame(frame);if(model){if(running)angle+=Math.min(.04,(now-last)/1000)*9;pose();renderer.render(scene,camera);}last=now;}requestAnimationFrame(frame);await load();
</script></html>
