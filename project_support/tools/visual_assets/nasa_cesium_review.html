<!doctype html><html lang="ko"><meta charset="utf-8"><title>NASA Cesium 실통합 검증</title>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Widgets/widgets.css">
<style>body{margin:0;background:#152333;color:white;font:14px sans-serif}header{padding:10px}button{padding:8px;margin-right:8px}#view{height:580px}pre{white-space:pre-wrap}</style>
<header><button id="run">9종 로딩 검증</button><button id="hover">호버</button><button id="cruise">순항</button><button id="cockpit">조종석</button><button id="outside">외부</button><span id="status">준비 중</span></header><div id="view"></div><pre id="report"></pre>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Cesium.js"></script>
<script type="module">
import {loadVisualModel} from '/digital_twin/visualization/web/visual_asset_loader.js';
import {RotorSpin} from '/digital_twin/visualization/web/rotor_spin.js';
const C=Cesium, viewer=new C.Viewer('view',{globe:false,skyBox:false,skyAtmosphere:false,baseLayer:false,animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,infoBox:false,selectionIndicator:false});viewer.scene.backgroundColor=C.Color.fromCssColorString('#c4d2df');viewer.scene.light=new C.DirectionalLight({direction:new C.Cartesian3(-.4,.1,-1),intensity:2});
const ids=['nasa_lift_cruise','nasa_multi_tiltrotor','nasa_qsmr','nasa_quadrotor_collflap','nasa_quadrotor_rpm','nasa_side_by_side','nasa_tiltduct_cross','nasa_tiltduct_direct','nasa_tiltwing'];const status=document.querySelector('#status'),report=document.querySelector('#report');let model,rig,tilt=0,meta;let last=performance.now();const matrix=C.Transforms.headingPitchRollToFixedFrame(C.Cartesian3.fromDegrees(127,37,100),new C.HeadingPitchRoll(-Math.PI/2,0,0));
viewer.scene.preRender.addEventListener(()=>{const now=performance.now();rig?.advance(Math.min(.04,(now-last)/1000),200,tilt,true);last=now;});
function exterior(){viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);viewer.camera.viewBoundingSphere(model.boundingSphere,new C.HeadingPitchRange(.7,-.45,model.boundingSphere.radius*3));}
document.querySelector('#hover').onclick=()=>{tilt=0;};document.querySelector('#cruise').onclick=()=>{tilt=Math.PI/2;};document.querySelector('#outside').onclick=exterior;
document.querySelector('#cockpit').onclick=()=>{const corrected=v=>new C.Cartesian3(v[0],-v[2],v[1]);const eye=C.Matrix4.multiplyByPoint(matrix,corrected(meta.cockpit.eye),new C.Cartesian3());const direction=C.Matrix4.multiplyByPointAsVector(matrix,corrected(meta.cockpit.forward),new C.Cartesian3());const up=C.Matrix4.multiplyByPointAsVector(matrix,corrected(meta.cockpit.up),new C.Cartesian3());viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);viewer.camera.frustum.near=.02;viewer.camera.setView({destination:eye,orientation:{direction,up}});};
document.querySelector('#run').onclick=async()=>{const results=[];try{for(const id of ids){status.textContent=id+' 로딩 중';rig?.detach();rig=null;if(model)viewer.scene.primitives.remove(model);const base='/digital_twin/model_library/visual_assets/aircraft/civilian/'+id+'/';meta=await(await fetch(base+'asset.json',{cache:'no-store'})).json();model=await loadVisualModel(C,{uri:base+'model.glb?v='+meta.model.sha256},id,matrix,30000,1);viewer.scene.primitives.add(model);model.show=true;await new Promise((resolve,reject)=>{if(model.ready)return resolve();const timer=setTimeout(()=>reject(Error('ready timeout')),30000);model.readyEvent.addEventListener(()=>{clearTimeout(timer);resolve();});});rig=new RotorSpin(C,meta.rotors);rig.attach(model);if(rig.missing.length)throw Error(rig.missing.join(','));exterior();results.push({id,sha256:meta.model.sha256,spinning:rig.counts.spinning,tilting:rig.counts.tilting,radius_m:model.boundingSphere.radius,missing:rig.missing});report.textContent=JSON.stringify(results,null,2);}status.textContent='9종 실제 Cesium 로딩 및 RotorSpin 연결 성공';}catch(e){status.textContent=e.stack;}};status.textContent='준비 완료';
</script></html>
