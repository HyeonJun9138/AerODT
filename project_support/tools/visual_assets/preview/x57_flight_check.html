<!doctype html><meta charset="utf-8"><title>X57 QA</title><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Widgets/widgets.css"><style>body{margin:0}#view{height:96vh}aside{position:absolute;top:5px;background:white;padding:10px}</style><div id="view"></div><aside><button id="hover">수직비행</button><button id="cruise">고정익</button><pre id="result">준비 중</pre></aside>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Cesium.js"></script><script type="module">
import {RotorSpin} from '/visualization/rotor_spin.js';const C=Cesium,v=new C.Viewer('view',{baseLayer:false,baseLayerPicker:false,geocoder:false,timeline:false,animation:false});v.scene.globe.show=false;v.scene.skyAtmosphere.show=false;v.scene.backgroundColor=C.Color.fromCssColorString('#8098ad');
const root='/visual-assets/aircraft/civilian/x_57/';const meta=await(await fetch(root+'asset.json')).json();const position=C.Cartesian3.fromDegrees(127,37.55,100);const model=await C.Model.fromGltfAsync({url:root+'flight_model.glb',modelMatrix:C.Transforms.eastNorthUpToFixedFrame(position),minimumPixelSize:0});v.scene.primitives.add(model);v.camera.lookAt(position,new C.Cartesian3(10,-12,8));let spin,tilt=0,last=performance.now();const result=document.getElementById('result');
v.scene.preRender.addEventListener(()=>{const now=performance.now();if(model.ready&&!spin){spin=new RotorSpin(C,meta.flight_visual.rotors);spin.attach(model);result.textContent=JSON.stringify({counts:spin.counts,missing:spin.missing});}if(spin){spin.advance((now-last)/1000,300,tilt,true);}last=now;});
document.getElementById('hover').onclick=()=>{tilt=0;result.textContent='수직비행: 작은 프롭 정지 / 날개 끝 회전';};document.getElementById('cruise').onclick=()=>{tilt=Math.PI/2;result.textContent='고정익: 작은 프롭 12개 회전';};
window.addEventListener('pagehide',()=>v.destroy(),{once:true});
</script>
