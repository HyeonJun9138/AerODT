<!doctype html><meta charset="utf-8"><title>UAM 조종면 QA</title><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Widgets/widgets.css"><style>body{margin:0}#view{height:96vh}aside{position:absolute;top:5px;background:white;padding:8px}</style><div id="view"></div><aside><button data-id="joby_s4">Joby</button><button data-id="kp2a">KP2</button><button data-id="amvlab_evtol">EVTOL</button><button data-id="x_57">X57</button><button data-id="projectairsim_airtaxi">AirTaxi</button><br><button id="neutral">중립</button><button id="roll">롤</button><button id="pitch">피치</button><button id="yaw">요</button><button id="audit">왕복 검증</button><pre id="result">준비 중</pre></aside>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Cesium.js"></script><script type="module">
import {ControlSurfacePose} from '/visualization/control_surface_pose.js';import {RotorSpin} from '/visualization/rotor_spin.js';
const C=Cesium,v=new C.Viewer('view',{baseLayer:false,baseLayerPicker:false,geocoder:false,timeline:false,animation:false});v.scene.globe.show=false;v.scene.skyAtmosphere.show=false;v.scene.skyBox.show=false;v.scene.backgroundColor=C.Color.fromCssColorString('#8197aa');
const at=C.Cartesian3.fromDegrees(127,37.55,100),result=document.getElementById('result');let model,controls,spin,id;
const sample={airborne:true,tilt_deg:90,speed_mps:45,roll_rate_deg_s:0,pitch_rate_deg_s:0,yaw_rate_deg_s:0};
async function load(name){id=name;controls=null;spin=null;if(model)v.scene.primitives.remove(model);result.textContent='로딩 '+id;const base='/visual-assets/aircraft/civilian/'+id+'/';const meta=await(await fetch(base+'asset.json')).json(),rig=meta.flight_visual?.rotors??meta.rotors;model=await C.Model.fromGltfAsync({url:base+(meta.flight_visual?.path??meta.model.path)+'?v=controls',modelMatrix:C.Transforms.eastNorthUpToFixedFrame(at)});v.scene.primitives.add(model);v.camera.lookAt(at,new C.Cartesian3(-10,-12,8));
 const remove=v.scene.preRender.addEventListener(()=>{if(!model.ready)return;remove();controls=new ControlSurfacePose(C,rig.control_surfaces);controls.attach(model);spin=new RotorSpin(C,rig);spin.attach(model);spin.advance(0,0,Math.PI/2);pose('neutral');result.textContent=JSON.stringify({id,surfaces:controls.parts.length,missing:controls.missing});});}
function pose(kind){Object.assign(sample,{roll_rate_deg_s:0,pitch_rate_deg_s:0,yaw_rate_deg_s:0});if(kind==='roll')sample.roll_rate_deg_s=20;if(kind==='pitch')sample.pitch_rate_deg_s=20;if(kind==='yaw')sample.yaw_rate_deg_s=20;controls?.update(sample);result.textContent=JSON.stringify({id,mode:kind,angles:controls?.parts.map(p=>[p.spec.name,p.angle*180/Math.PI])});}
for(const b of document.querySelectorAll('[data-id]'))b.onclick=()=>load(b.dataset.id);for(const k of ['neutral','roll','pitch','yaw'])document.getElementById(k).onclick=()=>pose(k);
document.getElementById('audit').onclick=()=>{pose('neutral');const original=controls.parts.map(p=>Array.from(p.node.matrix));pose('roll');pose('pitch');pose('yaw');pose('neutral');const reversible=controls.parts.every((p,i)=>Array.from(p.node.matrix).every((x,j)=>Math.abs(x-original[i][j])<1e-10));result.textContent=JSON.stringify({id,surfaces:controls.parts.length,missing:controls.missing,reversible});};
await load('joby_s4');window.addEventListener('pagehide',()=>v.destroy(),{once:true});
</script>
