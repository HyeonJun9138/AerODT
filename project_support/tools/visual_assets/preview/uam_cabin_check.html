<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}#label{position:absolute;color:white;background:#123b;padding:12px;font:20px sans-serif}</style><script type="importmap">{"imports":{"three":"/vendor/build/three.module.js","three/addons/":"/vendor/examples/jsm/"}}</script></head><body><div id="label"></div><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search),id=q.get('asset')||'joby_s4';const base='/library/aircraft/civilian/'+id+'/';
const meta=await(await fetch(base+'asset.json')).json();const scene=new T.Scene();scene.background=new T.Color('#91b6d1');scene.fog=new T.Fog('#91b6d1',30,160);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xf1f7ff,0x59656d,1.5));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(8,12,4);scene.add(sun);
const plane=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0x577b5d}));plane.rotation.x=-Math.PI/2;plane.position.y=-3;scene.add(plane);
const road=new T.Mesh(new T.BoxGeometry(160,.03,4),new T.MeshStandardMaterial({color:0x414952}));road.position.set(20,-2.97,0);scene.add(road);
for(let i=0;i<40;i++){const m=new T.Mesh(new T.BoxGeometry(1.2,.035,.09),new T.MeshBasicMaterial({color:0xf7dd94}));m.position.set(i*3-20,-2.93,0);scene.add(m);}
for(let i=0;i<24;i++){let height=2+(i%5)*1.3;const m=new T.Mesh(new T.BoxGeometry(3,height,3),new T.MeshStandardMaterial({color:i%2?0x8196a7:0xc0c6cc}));m.position.set(9+Math.floor(i/2)*5,height/2-3,(i%2?1:-1)*(6+(i%3)*2));scene.add(m);}
const model=(await new GLTFLoader().loadAsync(base+meta.flight_visual.path)).scene;scene.add(model);window.model=model;window.meta=meta;window.T=T;
const camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,.01,200);window.renderView=(mode='pilot',fov=60)=>{camera.fov=fov;camera.updateProjectionMatrix();const eye=new T.Vector3(...meta.cockpit.eye);camera.up.set(0,1,0);if(mode==='exterior'){camera.position.set(8,5,8);camera.lookAt(.3,.8,0);}else{if(mode==='aisle'){const seats=[];model.traverse(n=>{if(n.userData.cabin_role==='passenger_seat')seats.push(n.getWorldPosition(new T.Vector3()));});eye.x=Math.min(...seats.map(p=>p.x))+.12;eye.z=0;}if(mode==='cabin'){eye.z=0;const seats=[];model.traverse(n=>{if(n.userData.cabin_role==='passenger_seat')seats.push(n.getWorldPosition(new T.Vector3()));});const scale={joby_s4:.24,projectairsim_airtaxi:.48,kp2a:.32,amvlab_evtol:.19,x_57:.27}[id];eye.x=Math.max(...seats.map(p=>p.x))+scale*.30;eye.y=seats[0].y+scale*1.95;}camera.position.copy(eye);const yaw=mode==='left'?-.65:mode==='right'?.65:mode==='cabin'?Math.PI:0;camera.lookAt(eye.clone().add(new T.Vector3(Math.cos(yaw),-.10,Math.sin(yaw))));}renderer.render(scene,camera);document.querySelector('#label').textContent=id+' — '+mode+' '+fov+'° (illustrative cabin QA)';};const controls=document.createElement('div');controls.style='position:absolute;right:12px;top:12px;z-index:5;display:flex;gap:8px';
for(const mode of ['pilot','cabin','aisle','left','right','exterior']){const button=document.createElement('button');button.textContent=mode;button.onclick=()=>window.renderView(mode);controls.append(button);}document.body.append(controls);
window.renderView(q.get('view')||'pilot');window.ready=true;
</script></body></html>
